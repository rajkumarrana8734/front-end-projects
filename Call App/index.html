<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Stacked Profile Card & New Call Form</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>


  <div class="container" id="mainContainer">

  <div class="left-controls">
    <button class="control-btn" id="openModalBtn"><i class="ri-add-line"></i></button>
    <button class="control-btn" id="upBtn"><i class="ri-arrow-up-line"></i></button>
    <button class="control-btn" id="downBtn"><i class="ri-arrow-down-line"></i></button>
  </div>

  
  <div class="card-stack"></div>

  <div class="right-colors">
    <span class="dot white" data-color="#ffffff"></span>
    <span class="dot black" data-color="#000000"></span>
    <span class="dot purple" data-color="#9342f5"></span>
    <span class="dot orange" data-color="#f59342"></span>
    <span class="dot teal" data-color="#16a89c"></span>
  </div>
</div>
  
  <div class="form-card" id="newCallModal">
    <h2 class="form-title">New Call</h2>

    <form id="noteForm">
      <div class="form-group">
        <label>Image URL</label>
        <input  type="text" placeholder="https://example.com/photo.jpg">
      </div>

      <div class="form-group">
        <label>Full Name</label>
        <input  type="text" placeholder="Enter full name">
      </div>

      <div class="form-group">
        <label>Home Town</label>
        <input  type="text" placeholder="Enter home town">
      </div>

      <div class="form-group">
        <label>Purpose</label>
        <input  type="text" placeholder="e.g., Quick appointment note">
      </div>

      <div class="form-group">
        <label>Category</label>
        <div class="category-list" >
          <label  class="cat-pill emergency">
            <input type="radio" name="category" value="Emergency">
            <span class="custom-check"></span>
            <span>Emergency</span>
          </label>

          <label class="cat-pill important">
            <input  type="radio" name="category" value="Important">
            <span class="custom-check"></span>
            <span>Important</span>
          </label>

          <label class="cat-pill urgent">
            <input  type="radio" name="category" value="Urgent">
            <span class="custom-check"></span>
            <span>Urgent</span>
          </label>

          <label class="cat-pill no-rush">
            <input  type="radio" name="category" value="No Rush">
            <span class="custom-check"></span>
            <span>No Rush</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Create Note</button>
        <button type="button" class="btn-close" id="closeModalBtn">Close</button>
      </div>
    </form>
  </div>


 <script src="script.js"></script>

</body>
</html>
